<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="estilos/style.css">
    <script defer src="script.js"></script>
    <title>ShopeBrasil</title>
</head>

<body>
    <header>
        <div class="interface">
            <div class="logo">
                <span>SB</span>

                <div class="logo-header">
                    <h1>Shope</h1>
                    <span> Brasil</span>
                </div>
            </div>

            <ul class="header-menu">
                <li class="menu-link">
                    <a href="#">Início</a>
                </li>
                <li class="menu-link">
                    <a href="#">Categorias</a>
                </li>
                <li class="menu-link">
                    <a href="#">Ofertas</a>
                </li>
                <li class="menu-link">
                    <a href="#">Sobre</a>
                </li>
            </ul>

            <div class="header-pesquisa">
                <div class="pesquisa-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" name="" id="" placeholder="Procure produtos...">
            </div>

            <div class="header-icons">
                <i class="fa-solid fa-user"></i>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
        </div>
    </header>

    <main>
        <div class="interface">
            <div class="main-left">
                <div class="filter-icon">
                    <i class="fa-solid fa-filter"></i>
                    Filters
                </div>
                <button class="category-container">
                    <div class="category">
                        Categorias
                        <i class="fa-solid fa-angle-up"></i>
                    </div>
                    <div class="category-items">
                        <div class="category-item">
                            <div class="category-check">
                                <input type="checkbox" name="" id="">
                                Eletronicos
                            </div>
                            <div class="category-number">
                                156
                            </div>
                        </div>
                        <div class="category-item">
                            <div class="category-check">
                                <input type="checkbox" name="" id="">
                                Roupas
                            </div>
                            <div class="category-number">
                                156
                            </div>
                        </div>
                        <div class="category-item">
                            <div class="category-check">
                                <input type="checkbox" name="" id="">
                                Livros
                            </div>
                            <div class="category-number">
                                156
                            </div>
                        </div>
                        <div class="category-item">
                            <div class="category-check">
                                <input type="checkbox" name="" id="">
                                Sports
                            </div>
                            <div class="category-number">
                                156
                            </div>
                        </div>
                    </div>
                </button>


                <button class="rating-container">
                <div class="rating-minimum">
                    <p>Minimum Rating</p>
                    <i class="fa-solid fa-angle-up"></i>
                </div>
                <div class="rating-drop">
                    <div class="rating-item">
                        <input type="checkbox" name="" id="">
                        4+ Stars
                    </div>
                    <div class="rating-item">
                        <input type="checkbox" name="" id="">
                        4+ Stars
                    </div>
                    <div class="rating-item">
                        <input type="checkbox" name="" id="">
                        4+ Stars
                    </div>
                    <div class="rating-item">
                        <input type="checkbox" name="" id="">
                        4+ Stars
                    </div>
                </div>
            </button>
            </div>
            
        <div class="main-right">
                <div class="products">
                    <div class="products-bar">
                        <div class="products-value">
                        </div>
                        <div class="products-grid-btn">
                            <div class="products-buttons">
                                <button class="grid">
                                    <i class="fa-solid fa-table-cells"></i>
                                </button>
                                <button class="list">
                                    <i class="fa-solid fa-bars-staggered"></i>
                                </button>
                            </div>
                            <button class="products-sort">
                                <div class="product-numb">
                                    product(8)
                                </div>
                                <div class="product-order">
                                    <i class="fa-solid fa-up-down"></i>
                                    <p>Ordernar por: Relevance</p>
                                </div>
                                <i class="fa-solid fa-angle-down"></i>
                            </button>
                        </div>
                    </div>
                    <div class="products-grid">
                        <div class="product-card">
                            <img width="400px" src="imagens/t-shit 1.jpg" alt="">
                            <div class="product-info">
                                <h3>Camiseta Masculina</h3>
                                <p class="product-stars">
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                <p>(200)</p>
                                </p>
                                <p class="product-price">
                                    29$
                                </p>
                                <button class="product-favorite">
                                    <div class="new">
                                        new
                                    </div>
                                    <div class="favorite">
                                        <i class="fa-solid fa-heart"></i>
                                    </div>
                                </button>

                                <button class="cart">
                                    Adicionar No Carrinho
                                </button>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
