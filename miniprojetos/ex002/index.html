<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="estilos/style.css">
    <title>Modal</title>
</head>

<body>
    <button class="open-modal">
        Open Modal
    </button>

    <dialog class="modal">
        <form>
            <div class="form-header">
                <h1>Faça o Login</h1>
                <button class="btn-close" type="button">
                    X
                </button>
            </div>
            <div class="form-body">
                <div class="form-inputs">
                    <label for="ema">Email</label>
                    <input type="email" name="email" id="ema" placeholder="example@hotmail.com" autocomplete="off">
                </div>

                <div class="form-inputs">
                    <label for="pas">Senha</label>
                    <input type="password" name="password" id="pas" placeholder="**********">
                </div>

                <div class="password-options">
                    <div class="remember">
                        <input type="checkbox" name="check" id="check">
                        <label for="check">Lembrar Senha</label>
                    </div>

                    <div class="forgot">
                        <a href="#">Esqueceu a Senha?</a>
                    </div>
                </div>

                <button class="btn-login" type="submit">
                    Entrar na conta
                </button>

                <div class="register-options">
                    <div class="register">
                        <p>Não registrado?</p>
                    </div>

                    <div class="login">
                        <a href="#">Logar agora</a>
                    </div>
                </div>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>

</html>
