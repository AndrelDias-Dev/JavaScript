<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="estilos/style.css">
    <title>Modal</title>
</head>

<body>
    <button class="btn-open">
        Open Modal
    </button>

    <dialog class="modal">
        <form method="post">
            <div class="modal-header">
                <h1>Faça seu Login</h1>
                <button class="btn-close" type="button">
                    <i class="fa-solid fa-x"></i>
                </button>
            </div>

            <div class="modal-body">
                <div class="input-group">
                    <label for="email"><i class="fa-solid fa-user"></i></label>
                    <input type="email" name="email" id="email" placeholder="example@hotmail.com" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="senha"><i class="fa-solid fa-lock"></i></label>
                    <input type="password" name="senha" id="senha" placeholder="●●●●●●●" >
                </div>

                <div class="password-options">
                    <div class="password-remember">
                        <input type="checkbox" name="remember" id="remember">
                        <label for="remember">Lembrar Senha</label>
                    </div>

                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button class="btn-login" type="submit">
                    Entrar na conta
                </button>

                <div class="register">
                    <span>Não registrado?</span>
                    <a href="#">Cadastre-se</a>
                </div>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>

</html>
