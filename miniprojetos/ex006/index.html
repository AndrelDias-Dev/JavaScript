<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="estilos/style.css">
    <title>Slider/Carrossel</title>
</head>
<body>
    <div class="container">
        <header>
            <img src="imagens/logo.png">
            
            <div class="header-icons">
                <i class="fa-solid fa-user"></i>
                <i class="fa-solid fa-cart-shopping"></i>
                <i class="fa-solid fa-bars"></i>
            </div>
        </header>

        <div class="slider">
            <div class="slide">
                <div class="slide-content">
                    <h2>O MAIOR AQUÁRIO</h2>
                    <span>DO MUNDO</span>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Excepturi cumque quia accusamus explicabo modi saepe alias nisi, numquam, quisquam qui laboriosam maxime mollitia sit? Ex sapiente tenetur temporibus a esse?</p>
                    <div class="slide-buttons">
                        <button class="primary-button">
                            INGRESSOS
                        </button>

                        <button class="second-button">
                            SOBRE NÓS
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="navigation">
            <ul class="bullets">
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>

            <div class="nav-buttons">
                <button class="arrow-left">
                    <i class="fa-solid fa-angle-left"></i>
                </button>

                <button class="arrow-right">
                    <i class="fa-solid fa-angle-right"></i>
                </button>
            </div>
        </div>

    </div>
</body>
</html>
