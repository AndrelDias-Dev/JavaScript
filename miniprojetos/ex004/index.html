<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <title>Tabs</title>
</head>

<body>
    <div class="container">
        <div class="btn-options">
            <button class="btn-tab active" content-id="inicio">
                Início
            </button>

            <button class="btn-tab" content-id="curiosidades">
                Curiosidades
            </button>

            <button class="btn-tab" content-id="noticias">
                Notícias
            </button>

            <button class="btn-tab" content-id="sobre">
                Sobre
            </button>
        </div>
        <div class="content-tab">

            <div class="content show" id="inicio">
                <h1>Início</h1>
                <p>Conteúdo início</p>
            </div>

            <div class="content" id="curiosidades">
                <h1>Curiosidades</h1>
                <p>Conteúdo curiosidades</p>
            </div>

            <div class="content" id="noticias">
                <h1>Notícias</h1>
                <p>Conteúdo notícias</p>
            </div>

            <div class="content" id="sobre">
                <h1>Sobre</h1>
                <p>Conteúdo notícias</p>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
