<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <title>Menu Hamburguer</title>
</head>

<body>
    <header>
        <div class="logo">
            Logo
        </div>

        <button class="btn-menu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-menu-icon lucide-menu">
                <path d="M4 5h16" />
                <path d="M4 12h16" />
                <path d="M4 19h16" />
            </svg>
        </button>

        <nav class="menu">

            <a href="#" class="menu-link">Início</a>

            <a href="#" class="menu-link">Curiosidades</a>

            <a href="#" class="menu-link">Notícias</a>

            <a href="#" class="menu-link">Sobre</a>

            <button class="btn-login" id="openModal">
                Fazer Login
            </button>

            <dialog id="modal">
                <div class="modal-content">

                    <form id="formulario">
                        <div class="form-header">
                            <h2>Fazer Login</h2>
                            <button id="closeModal">X</button>
                        </div>
                        <div class="form-content">
                            <h3>Preencha todos os campos abaixo e confirme</h3>
                            <div>
                                <label for="imail">Email</label>
                                <input type="email"
                                 name="email" 
                                 id="imail" 
                                 placeholder="example@hotmail.com"
                                >
                            </div>
                            <div>
                                <label for="isen">Senha</label>
                                <input type="password"
                                 name="senha"
                                 id="isen"
                                 placeholder="•••••••••••"
                                >
                            </div>
                            <div class="form-footer">
                                <button id="confirmModal">
                                    Confirmar
                                </button>
                            </div>
                        </div>
                    </form>

                </div>
            </dialog>



        </nav>
    </header>
    <script src="script.js"></script>
</body>

</html>
