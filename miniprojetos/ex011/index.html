<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="estilos/geral.css" media="all">
    <link rel="stylesheet" href="task.css">
    <title>Lista de Tarefas</title>
</head>

<body>
    <section class="list-container">
        <div class="list-header">
            <h1>Minhas Tarefas</h1>
        </div>

        <div class="list-search">
            <div class="input-search">
                <label for="search"><i class="fa-solid fa-magnifying-glass"></i></label>
                <input type="text" name="search" id="search" placeholder="Pesquisar Tarefa...">
            </div>

            <button class="btn-search">
                Pesquisar
            </button>
        </div>

        <div class="list-adicionar">
            <input type="text" name="adtext" id="adtext" placeholder="Adicione uma Nova Tarefa...">

            <button class="adtask">
                + <p>Adicionar</p>
            </button>
        </div>

        <div class="task-container">
            
        </div>

        <div class="list-info">
            <div class="list-todos">
                <p>Todos (0)</p>
            </div>

            <div class="list-pendent">
                <p>Pendentes (0)</p>
            </div>

            <div class="list-conclui">
                <p>Concluídas (0)</p>
            </div>
        </div>

        <div class="pendent-container">
            <p>(0) tarefas pendentes</p>
        </div>
    </section>

    <script type="module" src="./app.js"></script>
</body>

</html>
