<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HORA</title>
    <style>
       body {
        font: normal 2em system-ui
       }

       input {
        font-size: 1.4em;
        padding: 10px;
        width: 280px;
       }
    </style>
</head>
<body>
    <h1>Quero horas são agora?</h1>
    <input type="number" name="n1" id="n1">
    <input type="button" value="ENVIAR" onclick="botao()">
    <div id="res"></div>
    <script>

        function botao() {
            var n1 = document.querySelector('input#n1')
            var res = document.querySelector('div#res')
            var hora = (n1.value)

            if (hora <= 11) {
                res.innerHTML = `Agora são ${hora} horas. Bom dia!`
            } else if (hora < 18) {
                res.innerHTML = `Agora são ${hora} horas. Boa Tarde!`
            } else {
                res.innerHTML = `Agora são ${hora} horas. Boa noite!`
            }
        }
        
        
   
    </script>
    
</body>
</html>
