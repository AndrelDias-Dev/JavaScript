<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body {
        font: normal 2em system-ui;
        text-align: center;
       }

       input {
        font-size: 1.4em;
        width: 400px;
       }

       p {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
       }
    </style>
</head>
<body>
    <h1>Qual é o seu país de origem?</h1>
    <p>
        <input placeholder="Digite seu páis aqui" type="text" name="ntx" id="ntx">
        <input type="button" value="Enviar" onclick="enviar()">
    </p>
    <div id="res"></div>

    <script>
        function enviar() {
            var ntx = document.querySelector('input#ntx')
            var pais = (ntx.value)
            var res = document.querySelector('div#res')

            if (pais == 'Brasil') {
                res.innerHTML = `Você é do ${pais}! Então você é brasileiro!`
            } else {
                res.innerHTML = `Você é do ${pais}! Então você é estrangeiro`
            }
        }
    </script>
</body>
</html>
