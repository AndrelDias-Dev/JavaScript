<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
    <style>
       body {
        font: normal 2em system-ui
       }

       input {
        font-size: 1.4em;
        padding: 10px;
        width: 330px;
       }
    </style>
</head>
<body>
    <h1>Detran</h1>
    <p>Confira a velocidade do veículo</p>
    <p>
        <input type="number" name="n1" id="n1">
        <input type="button" value="VERIFICAR" onclick="verificar()">
    </p>
    <div id="res"></div>
    <script>
        function verificar() {
            var n1 = document.querySelector('input#n1')
            var res = document.querySelector('div#res')
            var vel = (n1.value)

            if (vel < 60) {
                res.innerHTML = `Nada encontrado.`
            } else {
                res.innerHTML = `Você acabou de ser multado por excesso de velocidade. Foram cerca de ${vel}km/h.`
            }
        }
    </script>

    
</body>
</html>
