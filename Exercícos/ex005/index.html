<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Interativo</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            font: normal 3em Arial; 
        }

        div {
            background-color: white;
            color: black;
            width: 400px;
            height: 400px;
            line-height: 400px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform:translate(-50% , -50%);

        }
    </style>
</head>
<body>
    <div id="area">
        Interaja...
    </div>
    <script>
    var a = document.querySelector('div#area')
    a.addEventListener('click', clicar)
    a.addEventListener('mouseenter', entrar)
    a.addEventListener('mouseout', sair)

    function clicar() {
        a.innerText = 'Clicou!'
        a.style.background = 'red'
        a.style.color = 'white'
    }

    function entrar() {
        a.innerText = 'Entrou!'
        a.style.background = 'blue'
        a.style.color = 'white'
    }

    function sair() {
        a.innerText = 'Saiu!'
        a.style.background = 'orange'
        a.style.color = 'white'
    }

    </script>
</body>
</html>
