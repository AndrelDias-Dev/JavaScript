<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voto</title>
    <style>
       body {
        font: normal 1.8em system-ui
       }

       input {
        font-size: 1.3em;
        padding: 10px;
       }

       input[type=number] {
        width: 440px;
       }

       input[type=button] {
        background-color: black;
        color: white;
        font-weight: bolder;
        transition: 0.2s;
        cursor: pointer;
       }

       input[type=button]:hover {
        background-color: white;
        color: black;
       }
    </style>
</head>
<body>
    <h1>Confira se você tem direito ao voto</h1>
    <input placeholder="Digite sua idade" type="number" name="n1" id="n1">
    <input type="button" value="VERIFICAR" onclick="botao()">
    <div id="res"></div>
    <script>
    function botao() {
    var n1 = document.querySelector('input#n1')
    var res = document.querySelector('div#res')
    var idade = Number(n1.value)

    if (idade < 16) {
        res.innerHTML = `Você tem ${idade} anos, você ainda não pode votar.`
    } else if (idade <= 17 || idade > 70) {
        res.innerHTML = `Você ${idade} anos, você tem o direito do voto opcional.`
    } else if (idade <= 70) {
        res.innerHTML = `Você ${idade} anos,  você tem a obrigação de votar`
    } 
    } 

    </script>
    

</body>
</html>
