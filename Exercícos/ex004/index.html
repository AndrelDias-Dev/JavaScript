<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
            color: white;
            font: normal 2.5em system-ui;

        }
    </style>
</head>
<body>
   <!--  Olá,mundo 
    (Caracteres, Maiúsculo e Minúsculo) -->

    <script>
      var nome = window.prompt('Digite um seu nome!') 
      document.write(`O seu nome tem ${nome.length} letras. </br>`)
      document.write(`O seu nome em Maiúsculo é ${nome.toUpperCase()} </br>`)
      document.write(`O seu nome em Minúsculo é ${nome.toLowerCase()}`)

    </script>    
</body>
</html>
