<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
            color: white;
            font: normal 2.5em system-ui;

        }
    </style>
</head>
<body>
   <!--  Olá,mundo 
    (Caracteres, Maiúsculo e Minúsculo) -->

    <script>
        var nome = window.prompt('Qual é o seu nome?')
        document.write(`Seu nome tem ${nome.length} letras </br>` )
        document.write(`Seu nome em maiúsculo é ${nome.toUpperCase()} </br>`)
        document.write(`Seu nome em minúsculo é ${nome.toLowerCase()}`)
    </script>    
</body>
</html>
