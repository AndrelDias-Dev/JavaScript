<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>
    <style>
        body {
            background-color: darkcyan;
            color: white;
            font-size: 2em;
        }

        h1 {
            color: rgb(255, 200, 0);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Meu primeiro código em Javascript (Soma)</p>
    <script>
    var n1 = Number(window.prompt('Digite um primeiro número'))
    var n2 = Number(window.prompt('Digite um segundo número.'))
    var soma = n1 + n2
    window.alert('A soma dos valores é de  ' + soma + '!')      
    </script>
</body>
</html>
